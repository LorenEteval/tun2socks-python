name: Deploy PyPI

on: [push, pull_request]

jobs:
  build-wheels:
    name: Wheels / ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - os: windows-2025
            platform: windows
            arch: AMD64
          - os: windows-11-arm
            platform: windows
            arch: ARM64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Linux builds run in manylinux containers and install Go through
      # tool.cibuildwheel.linux.before-all instead of using the host Go.
      - uses: actions/setup-go@v7
        if: matrix.platform != 'linux'
        with:
          go-version: "1.26.3"
          check-latest: true
          cache-dependency-path: tun2socks-go/go.sum

      - uses: egor-tensin/setup-mingw@v2
        if: matrix.platform == 'windows' && matrix.arch == 'AMD64'
        with:
          platform: x64

      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616-ucrt-aarch64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip'
          $expectedHash = '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM-MinGW checksum mismatch: expected $expectedHash, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $destination
          $gcc = Get-ChildItem -Path $destination -Filter gcc.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1
          if (-not $gcc) {
            throw 'Could not locate LLVM-MinGW gcc.exe'
          }

          $toolchainBin = $gcc.Directory.FullName
          $target = & (Join-Path $toolchainBin 'gcc.exe') -dumpmachine
          if ($target -ne 'aarch64-w64-windows-gnu') {
            throw "Unexpected LLVM-MinGW target: $target"
          }

          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # cibuildwheel's CPython 3.8 arm64 build uses this native interpreter
      # instead of running an Intel interpreter under Rosetta.
      - uses: actions/setup-python@v7
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        with:
          python-version: "3.8"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist
      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  store:
    name: Store the distribution packages
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - build-sdist
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify distributions are native and platform-tagged
        run: python scripts/validate_distributions.py dist
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish-to-pypi:
    name: Publish Python distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - store
    runs-on: ubuntu-latest
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/tun2socks
    permissions:
      id-token: write
    steps:
      - name: Download all the distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all the distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes ""
      - name: Upload distributions to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
