[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0,<4",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = [
    "cp3{8,9,10,11,12,13,14}-*",
    "cp3{13,14}t-*",
]
skip = "*-musllinux_*"
enable = ["cpython-freethreading"]
test-command = [
    "python -c \"import pathlib, tun2socks; source_package = (pathlib.Path(r'{project}') / 'tun2socks').resolve(); module = pathlib.Path(tun2socks.__file__).resolve(); assert module.parent != source_package, f'imported {module} from the source checkout'\"",
    "python {project}/sample/sample.py",
]

[tool.cibuildwheel.linux]
before-all = [
    "curl --fail --location --silent --show-error https://go.dev/dl/go1.26.3.linux-amd64.tar.gz --output /tmp/tun2socks-go.tar.gz",
    "tar -C /usr/local -xzf /tmp/tun2socks-go.tar.gz",
    "ln -sf /usr/local/go/bin/go /usr/local/bin/go",
]
manylinux-x86_64-image = "manylinux2014"
